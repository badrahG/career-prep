<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338ca"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Top shine -->
  <rect width="32" height="16" rx="8" fill="url(#shine)"/>

  <!-- Peak dot -->
  <circle cx="16" cy="7" r="2.8" fill="white"/>

  <!-- Upward chevron (career growth) -->
  <path d="M6.5 23.5 L16 10 L25.5 23.5"
        stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Second inner chevron (depth) -->
  <path d="M10.5 23.5 L16 15.5 L21.5 23.5"
        stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        stroke-opacity="0.35"/>

  <!-- Base bar (document / foundation) -->
  <rect x="8" y="26.5" width="16" height="2" rx="1" fill="white" fill-opacity="0.4"/>
</svg>
