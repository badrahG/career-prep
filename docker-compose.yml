services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_platform
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d career_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      # Overrides DATABASE_URL from .env to point at the db service
      DATABASE_URL: postgresql://odoo:odoo123@db:5432/career_platform
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
